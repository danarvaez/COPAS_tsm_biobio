<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TSM Biobío</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Temperatura superficial del mar</h1>
      <p class="sub" id="region">Región del Biobío</p>
    </div>
    <button id="refresh" class="refresh" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <div id="demo" class="banner" hidden>Datos de ejemplo — aún no hay sensores configurados.</div>
  <div id="errors" class="banner warn" hidden></div>

  <section class="summary" aria-live="polite">
    <div class="big"><span id="avg">—</span><small>°C</small></div>
    <div class="meta">
      <div><span class="lbl">Promedio regional</span></div>
      <div id="range" class="muted">Cargando…</div>
      <div id="updated" class="muted small"></div>
    </div>
  </section>

  <div id="map" role="region" aria-label="Mapa de sensores"></div>
  <div class="legend" id="legend"></div>

  <ul id="list" class="list"></ul>

  <footer class="foot">
    <span id="count"></span> · Datos: Sofar Spotter API, ERDDAP, FVON · Batimetría: GEBCO Compilation Group (2026) GEBCO_2026 Grid · Etiquetas © OpenStreetMap, © CARTO
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
