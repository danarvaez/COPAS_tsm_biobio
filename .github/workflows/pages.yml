name: Actualizar y publicar TSM Biobio

on:
  schedule:
    - cron: "*/28 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar lecturas de Sofar y ERDDAP/FVON
        env:
          SOFAR_TOKEN: ${{ secrets.SOFAR_TOKEN }}
          SOFAR_SPOTTERS: ${{ secrets.SOFAR_SPOTTERS }}
        run: node scripts/build-data.mjs
      - uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
